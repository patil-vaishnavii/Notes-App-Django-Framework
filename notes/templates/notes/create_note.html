{% extends "base.html" %}

{% block content %}
    <h1>Create Note</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Title</label>
        <br>

        <input
            type="text"
            name="title"
            required
        >

        <br><br>

        <label>Content</label>
        <br>

        <textarea
            name="content"
            rows="8"
            required
        ></textarea>

        <br><br>

        <button type="submit">
            Save Note
        </button>

    </form>

    <br>

    <a href="{% url 'home' %}">
        Back to Notes
    </a>

{% endblock  %}
