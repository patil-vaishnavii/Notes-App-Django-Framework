<!DOCTYPE html>
<html>
<head>
    <title>Delete Note</title>
</head>

<body>

    <h1>Delete Note</h1>

    <p>
        Are you sure you want to delete
        "<strong>{{ note.title }}</strong>"?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'home' %}">
            Cancel
        </a>

    </form>

</body>
</html>
