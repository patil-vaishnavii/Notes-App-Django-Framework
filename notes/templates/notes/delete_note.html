{% extends "base.html" %}

{% block content %}
    <h1>Delete Note</h1><br>

    <p>
        Are you sure you want to delete
        "<strong>{{ note.title }}</strong>"?
    </p><br>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button><br><br>

        <a href="{% url 'home' %}">
            Cancel
        </a>

    </form>

{% endblock %}
