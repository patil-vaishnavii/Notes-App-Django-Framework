{% extends "base.html" %}

{% block content %}

    <h1>Edit Note</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Title</label>
        <br>

        <input
            type="text"
            name="title"
            value="{{ note.title }}"
            required
        >

        <br><br>

        <label>Content</label>
        <br>

        <textarea
            name="content"
            rows="8"
            required
        >{{ note.content }}</textarea>

        <br><br>

        <button type="submit">
            Update Note
        </button>

    </form>

    <br>

    <a href="{% url 'home' %}">
        Cancel
    </a>

{% endblock  %}
